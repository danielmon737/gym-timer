<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#090909">
  <title>GYM TIMER</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Gym Timer">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090909;
      --surface: #131313;
      --border: #252525;
      --go: #C8FF00;
      --rest: #FF3535;
      --neutral: #666;
      --text: #EBEBEB;
      --dim: #333;
      --accent: #3B82F6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      height: 100%; overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }

    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      padding: max(env(safe-area-inset-top), 20px) 16px max(env(safe-area-inset-bottom), 20px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── MODE SELECT ── */
    #screen-mode { justify-content: center; gap: 10px; }
    .mode-header { text-align: center; margin-bottom: 20px; }
    .mode-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px; letter-spacing: 8px;
      color: var(--go); line-height: 1;
    }
    .mode-header p {
      font-size: 13px; color: var(--neutral);
      letter-spacing: 3px; text-transform: uppercase; margin-top: 6px;
    }

    .mode-btn {
      background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 22px 20px;
      cursor: pointer; text-align: center;
      transition: border-color 0.1s, transform 0.1s;
      position: relative; overflow: hidden;
    }
    .mode-btn:active { transform: scale(0.97); border-color: var(--go); }
    .mode-btn .mode-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; letter-spacing: 3px; color: var(--text);
    }

    .autolock-tip {
      text-align: center; margin-top: 14px;
      padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11px; color: var(--neutral);
      letter-spacing: 1px; line-height: 1.6;
    }
    .autolock-tip strong { color: var(--text); }

    /* ── CONFIG ── */
    #screen-config { justify-content: flex-start; }

    .config-top-bar {
      display: flex; align-items: stretch; gap: 10px;
      margin-bottom: 16px; padding-top: 4px; flex-shrink: 0;
    }
    .back-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px; letter-spacing: 2px;
      padding: 14px 20px; border-radius: 10px;
      cursor: pointer; text-transform: uppercase;
      transition: border-color 0.1s, background 0.1s;
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .back-btn .back-arrow { font-size: 24px; line-height: 1; color: var(--go); }
    .back-btn:active { border-color: var(--go); background: rgba(200,255,0,0.06); }

    .config-title-box {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px;
    }
    .config-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; letter-spacing: 3px; color: var(--go);
    }

    /* ── SUBMODE TABS ── */
    .submode-tabs {
      display: flex; gap: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      margin-bottom: 16px; flex-shrink: 0;
    }
    .submode-tab {
      flex: 1; padding: 12px 6px; text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px; letter-spacing: 2px;
      color: var(--neutral); cursor: pointer;
      transition: color 0.15s, background 0.15s;
      border: none; background: none;
    }
    .submode-tab + .submode-tab { border-left: 1px solid var(--border); }
    .submode-tab.active { color: var(--bg); background: var(--go); }

    .config-body {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 14px;
    }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label {
      font-size: 11px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--neutral);
    }

    /* ── NUMBER INPUT ── */
    .number-input {
      display: flex; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .num-btn {
      background: none; border: none; color: var(--go); font-size: 30px;
      width: 60px; height: 60px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-family: 'Bebas Neue', sans-serif;
    }
    .num-btn:active { background: rgba(200,255,0,0.08); }
    .num-display {
      flex: 1; text-align: center; font-family: 'Bebas Neue', sans-serif;
      font-size: 40px; color: var(--text); letter-spacing: 2px;
    }

    /* ── SCROLL PICKER ── */
    .picker-row {
      display: flex; align-items: stretch;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; height: 180px;
      position: relative;
    }
    .picker-col { flex: 1; position: relative; overflow: hidden; }
    .picker-col + .picker-col { border-left: 1px solid var(--border); }
    .picker-col-label {
      position: absolute; top: 6px; left: 0; right: 0;
      text-align: center; font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--neutral);
      z-index: 5; pointer-events: none;
    }
    .picker-scroller {
      height: 100%; overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .picker-scroller::-webkit-scrollbar { display: none; }
    .picker-item {
      height: 60px; display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px; letter-spacing: 2px; color: var(--dim);
      scroll-snap-align: center; transition: color 0.15s, transform 0.15s;
    }
    .picker-item.selected { color: var(--text); transform: scale(1.08); }
    .picker-row::before {
      content: ''; position: absolute;
      top: 50%; left: 0; right: 0; height: 60px;
      transform: translateY(-50%);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      background: rgba(200,255,0,0.03);
      pointer-events: none; z-index: 3;
    }
    .picker-col::before, .picker-col::after {
      content: ''; position: absolute; left: 0; right: 0;
      height: 50px; z-index: 4; pointer-events: none;
    }
    .picker-col::before { top: 0; background: linear-gradient(to bottom, var(--surface) 20%, transparent); }
    .picker-col::after { bottom: 0; background: linear-gradient(to top, var(--surface) 20%, transparent); }
    .picker-separator {
      display: flex; align-items: center; justify-content: center;
      width: 24px; flex-shrink: 0; font-family: 'Bebas Neue', sans-serif;
      font-size: 28px; color: var(--neutral);
    }

    /* ── 3-COLUMN PICKER ROW ── */
    .triple-picker {
      display: flex; gap: 8px; align-items: stretch;
    }
    .triple-picker .picker-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .triple-picker .picker-group-label {
      text-align: center; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--neutral);
    }
    .triple-picker .picker-row { height: 170px; }

    .start-btn {
      background: var(--go); color: #090909;
      border: none; border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px; letter-spacing: 5px;
      padding: 18px; cursor: pointer; width: 100%;
      transition: transform 0.1s, opacity 0.1s;
      margin-top: 14px; flex-shrink: 0;
    }
    .start-btn:active { transform: scale(0.98); opacity: 0.88; }

    /* ── PRE-COUNTDOWN ── */
    #screen-countdown { justify-content: center; align-items: center; }
    .cd-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(140px, 42vw, 260px);
      line-height: 1; color: var(--go); opacity: 0; transform: scale(1.6);
    }
    .cd-number.pop { animation: cdPop 0.75s ease-out forwards; }
    @keyframes cdPop {
      0%   { opacity: 0; transform: scale(1.8); }
      20%  { opacity: 1; transform: scale(1); }
      70%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.7); }
    }
    .cd-label {
      font-size: 13px; letter-spacing: 4px;
      text-transform: uppercase; color: var(--neutral); margin-top: 20px;
    }

    /* ── TIMER ── */
    #screen-timer { justify-content: space-between; align-items: stretch; }
    .timer-top { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; }
    .phase-badge {
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 4px;
      padding: 6px 16px; border-radius: 5px;
      background: var(--go); color: #090909;
      transition: background 0.25s, color 0.25s;
    }
    .phase-badge.rest { background: var(--rest); color: #fff; }
    .phase-badge.done { background: var(--dim); color: var(--neutral); }

    .round-display {
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--neutral); text-align: right; line-height: 1.3;
    }
    .round-display strong {
      display: block; font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; color: var(--text); letter-spacing: 1px;
    }

    .timer-main {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 16px;
    }
    .big-time {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(96px, 28vw, 150px);
      line-height: 0.9; letter-spacing: 6px;
      color: var(--text); transition: color 0.25s;
    }
    .big-time.go { color: var(--go); }
    .big-time.rest { color: var(--rest); }
    .big-time.done { color: var(--dim); }

    .progress-track { width: 100%; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill {
      height: 100%; border-radius: 3px; background: var(--go);
      transition: width 0.08s linear, background 0.25s;
    }
    .progress-fill.rest { background: var(--rest); }

    .next-up {
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--neutral); min-height: 20px;
    }
    .next-up span { color: var(--text); }
    .next-up.done-msg { color: var(--go); font-size: 15px; }

    .timer-controls { display: flex; gap: 10px; width: 100%; }
    .ctrl-btn {
      flex: 1; padding: 18px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--neutral); font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 3px; cursor: pointer;
    }
    .ctrl-btn:active { transform: scale(0.97); }
    .ctrl-btn.primary { background: var(--go); color: #090909; border-color: var(--go); flex: 2; }
    .ctrl-btn.primary.paused { background: var(--surface); color: var(--go); border-color: var(--go); }
    .ctrl-btn.primary.done-state { background: var(--surface); color: var(--dim); border-color: var(--dim); }

    /* ── HOME / SESSIONS ── */
    [hidden] { display: none !important; }
    #screen-mode { justify-content: flex-start; gap: 10px; }
    .mode-header { margin-top: 8px; margin-bottom: 4px; }
    .section-label {
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--neutral); margin: 12px 2px 0;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .section-label span { letter-spacing: 1px; text-transform: none; }
    #sess-list { display: flex; flex-direction: column; gap: 8px; }
    .sess-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      transition: border-color 0.1s, transform 0.1s;
    }
    .sess-card:active { transform: scale(0.98); border-color: var(--go); }
    .sess-card.today { border-color: var(--go); }
    .sess-card.done { opacity: 0.55; }
    .sess-main { flex: 1; min-width: 0; }
    .sess-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--text); line-height: 1; }
    .sess-title em { font-style: normal; color: var(--go); }
    .sess-meta { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--neutral); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sess-icon { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--neutral); width: 28px; text-align: right; flex-shrink: 0; }
    .sess-card.today .sess-icon, .sess-card.done .sess-icon { color: var(--go); }
    .sess-empty { text-align: center; color: var(--neutral); font-size: 13px; letter-spacing: 1px; padding: 18px; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; line-height: 1.6; }
    .text-btn { background: none; border: none; color: var(--neutral); font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; padding: 8px 2px; cursor: pointer; }
    .text-btn:active { color: var(--go); }
    .home-foot { display: flex; justify-content: flex-end; align-items: center; }
    .run-ex-name.rest { color: var(--rest); }

    /* ── SESSION DETAIL ── */
    #screen-session { justify-content: flex-start; }
    .sess-note { font-size: 15px; color: var(--text); line-height: 1.45; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--go); border-radius: 8px; margin-bottom: 10px; }
    .sess-note.muted { border-left-color: var(--neutral); color: var(--neutral); }
    .block-list { display: flex; flex-direction: column; gap: 6px; }
    .block-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .block-row.optional { border-style: dashed; }
    .block-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1.5px; color: var(--text); }
    .block-name small { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px; color: var(--neutral); margin-left: 6px; text-transform: uppercase; }
    .block-rx { font-size: 16px; color: var(--go); letter-spacing: 1px; text-align: right; flex-shrink: 0; max-width: 60%; }
    .block-rx small { display: block; font-size: 11px; color: var(--neutral); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
    .sess-est { text-align: center; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--neutral); margin-top: 12px; }
    .detail-actions { margin-top: auto; padding-top: 12px; flex-shrink: 0; }

    /* ── SESSION RUN ── */
    #screen-run { justify-content: space-between; }
    .end-btn { background: none; border: 1px solid var(--border); color: var(--neutral); font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 3px; padding: 7px 12px; border-radius: 5px; cursor: pointer; margin-left: 10px; }
    .end-btn:active { border-color: var(--rest); color: var(--rest); }
    .run-ex { text-align: center; }
    .run-ex-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(34px, 10vw, 48px); letter-spacing: 3px; color: var(--text); line-height: 1; }
    .run-ex-side { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 4px; color: var(--go); margin-top: 6px; min-height: 22px; }
    .run-ex-sub { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--neutral); min-height: 18px; text-align: center; }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; }
    .stepper .num-btn { width: 72px; height: 88px; font-size: 44px; }
    .stepper-val { font-family: 'Bebas Neue', sans-serif; font-size: clamp(96px, 26vw, 140px); line-height: 0.9; letter-spacing: 4px; color: var(--go); min-width: 130px; text-align: center; }
    .stepper-label { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--neutral); text-align: center; margin-top: 4px; }
    .run-elapsed { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--dim); text-align: center; margin-top: 4px; }

    /* ── SUMMARY ── */
    #screen-summary { justify-content: flex-start; }
    .sum-head { text-align: center; margin: 8px 0 14px; flex-shrink: 0; }
    .sum-head h2 { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 5px; color: var(--go); line-height: 1; }
    .sum-head p { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--neutral); margin-top: 6px; }
    .sum-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
    .sum-ex { color: var(--text); letter-spacing: 1px; }
    .sum-act { color: var(--go); letter-spacing: 1px; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .sum-act small { display: block; color: var(--neutral); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
    .sum-act input { width: 76px; background: var(--bg); border: 1px solid var(--border); color: var(--go); font-family: 'Bebas Neue', sans-serif; font-size: 22px; text-align: center; border-radius: 6px; padding: 4px; }
    textarea.notes { width: 100%; min-height: 64px; margin-top: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-size: 15px; padding: 10px 12px; resize: vertical; user-select: text; -webkit-user-select: text; flex-shrink: 0; }
    .sum-actions { display: flex; gap: 10px; margin-top: auto; padding-top: 12px; flex-shrink: 0; }
    .toast { position: fixed; left: 50%; bottom: max(env(safe-area-inset-bottom), 24px); transform: translateX(-50%) translateY(20px); background: var(--go); color: var(--bg); font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 3px; padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 300; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── FLASH ── */
    #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 200; }
    #flash.flash-in { animation: flashAnim 0.35s ease-out forwards; }
    @keyframes flashAnim { 0% { opacity: 0.55; } 100% { opacity: 0; } }

    /* ── NOISE ── */
    body::after {
      content: ''; position: fixed; inset: 0;

<script>
// ─────────────────────────── STATE ───────────────────────────────
let mode = null;     // 'interval' | 'countdown' | 'stopwatch'
let submode = null;  // 'interval'|'emom'|'tabata' or 'countdown'|'amrap' or 'fortime'|'stopwatch'
let cfg = {};
const ts = {
  status: 'idle', phaseIdx: 0, phases: [], round: 1,
  intervalId: null, lastRemSec: -1,
  phaseWallStart: 0, pausedElapsed: 0,
};
let audioCtx = null;
let wakeLock = null;
let countdownTimeout = null;

function getPhaseElapsed() {
  return ts.status === 'running'
    ? ts.pausedElapsed + (Date.now() - ts.phaseWallStart)
    : ts.pausedElapsed;
}

// ─────────────────────────── SCREENS ─────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

// ──────────────────────────── MODE ───────────────────────────────
function selectMode(m) {
  mode = m;
  if (m === 'interval') { submode = 'interval'; buildIntervalConfig(); }
  else if (m === 'countdown') { submode = 'countdown'; buildCountdownConfig(); }
  else if (m === 'stopwatch') { submode = 'fortime'; buildStopwatchConfig(); }
  showScreen('config');
}

// ────────────────────── SUBMODE TABS ─────────────────────────────
function buildTabs(tabs, activeTab) {
  const container = document.getElementById('submode-container');
  container.innerHTML = `<div class="submode-tabs">
    ${tabs.map(t => `<button class="submode-tab${t.id === activeTab ? ' active' : ''}"
      onclick="switchSubmode('${t.id}')">${t.label}</button>`).join('')}
  </div>`;
}

function switchSubmode(sm) {
  submode = sm;
  if (mode === 'interval') buildIntervalConfig();
  else if (mode === 'countdown') buildCountdownConfig();
  else if (mode === 'stopwatch') buildStopwatchConfig();
}

// ─────────────────── INTERVAL / EMOM / TABATA ────────────────────
function buildIntervalConfig() {
  document.getElementById('config-title').textContent = 'INTERVAL | EMOM | TABATA';
  buildTabs([
    { id: 'interval', label: 'INTERVAL' },
    { id: 'emom', label: 'EMOM' },
    { id: 'tabata', label: 'TABATA' },
  ], submode);

  const body = document.getElementById('config-body');
  let defWork, defRest, defRounds;
  if (submode === 'tabata')  { defWork = [0,20]; defRest = [0,10]; defRounds = 8; }
  else if (submode === 'emom') { defWork = [1,0]; defRest = [0,0]; defRounds = 10; }
  else { defWork = [0,40]; defRest = [0,20]; defRounds = 10; }

  body.innerHTML = `
    <div class="triple-picker">
      <div class="picker-group">
        <div class="picker-group-label">Work</div>
        <div class="picker-row" id="picker-work">
          <div class="picker-col">
            <div class="picker-scroller" id="ps-work-min">
              ${minItems(10)}
            </div>
          </div>
          <div class="picker-separator">:</div>
          <div class="picker-col">
            <div class="picker-scroller" id="ps-work-sec">
              ${secItems()}
            </div>
          </div>
        </div>
      </div>
      <div class="picker-group">
        <div class="picker-group-label">Rest</div>
        <div class="picker-row" id="picker-rest">
          <div class="picker-col">
            <div class="picker-scroller" id="ps-rest-min">
              ${minItems(10)}
            </div>
          </div>
          <div class="picker-separator">:</div>
          <div class="picker-col">
            <div class="picker-scroller" id="ps-rest-sec">
              ${secItems()}
            </div>
          </div>
        </div>
      </div>
      <div class="picker-group">
        <div class="picker-group-label">Rounds</div>
        <div class="picker-row" id="picker-rounds">
          <div class="picker-col">
            <div class="picker-scroller" id="ps-rounds">
              ${Array.from({length:50}, (_,i) => `<div class="picker-item" data-val="${i+1}">${String(i+1).padStart(2,'0')}</div>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>`;

  requestAnimationFrame(() => {
    initScroller('ps-work-min', defWork[0]);
    initScroller('ps-work-sec', defWork[1]);
    initScroller('ps-rest-min', defRest[0]);
    initScroller('ps-rest-sec', defRest[1]);
    initScroller('ps-rounds', defRounds);
  });
}

// ─────────────────── COUNTDOWN / AMRAP ───────────────────────────
function buildCountdownConfig() {
  document.getElementById('config-title').textContent = 'COUNTDOWN | AMRAP';
  buildTabs([
    { id: 'countdown', label: 'COUNTDOWN' },
    { id: 'amrap', label: 'AMRAP' },
  ], submode);

  const body = document.getElementById('config-body');
  body.innerHTML = `
    <div class="field-group">
      <div class="field-label">Duration</div>
      <div class="picker-row" id="picker-duration">
        <div class="picker-col">
          <div class="picker-col-label">MIN</div>
          <div class="picker-scroller" id="ps-dur-min">
            ${minItems(99)}
          </div>
        </div>
        <div class="picker-separator">:</div>
        <div class="picker-col">
          <div class="picker-col-label">SEC</div>
          <div class="picker-scroller" id="ps-dur-sec">
            ${secItems()}
          </div>
        </div>
      </div>
    </div>`;

  requestAnimationFrame(() => {
    initScroller('ps-dur-min', 10);
    initScroller('ps-dur-sec', 0);
  });
}

// ─────────────────── FOR TIME / STOPWATCH ────────────────────────
function buildStopwatchConfig() {
  document.getElementById('config-title').textContent = 'FOR TIME | STOPWATCH';
  buildTabs([
    { id: 'fortime', label: 'FOR TIME' },
    { id: 'stopwatch', label: 'STOPWATCH' },
  ], submode);

  const body = document.getElementById('config-body');
  if (submode === 'fortime') {
    body.innerHTML = `
      <div class="field-group">
        <div class="field-label">Time Cap (optional)</div>
        <div class="picker-row" id="picker-cap">
          <div class="picker-col">
            <div class="picker-col-label">MIN</div>
            <div class="picker-scroller" id="ps-cap-min">
              <div class="picker-item" data-val="0">--</div>
              ${Array.from({length:99}, (_,i) => `<div class="picker-item" data-val="${i+1}">${String(i+1).padStart(2,'0')}</div>`).join('')}
            </div>
          </div>
          <div class="picker-separator">:</div>
          <div class="picker-col">
            <div class="picker-col-label">SEC</div>
            <div class="picker-scroller" id="ps-cap-sec">
              ${secItems()}
            </div>
          </div>
        </div>
      </div>`;
    requestAnimationFrame(() => {
      initScroller('ps-cap-min', 0);
      initScroller('ps-cap-sec', 0);
    });
  } else {
    body.innerHTML = `
      <div style="text-align:center; color:var(--neutral); font-size:14px; letter-spacing:2px; padding: 40px 0;">
        Simple count-up timer.<br>Tap START when ready.
      </div>`;
  }
}

// ─────────────────── PICKER HELPERS ──────────────────────────────
function minItems(max) {
  return Array.from({length: max+1}, (_,i) =>
    `<div class="picker-item" data-val="${i}">${String(i).padStart(2,'0')}</div>`
  ).join('');
}
function secItems() {
  return Array.from({length:12}, (_,i) =>
    `<div class="picker-item" data-val="${i*5}">${String(i*5).padStart(2,'0')}</div>`
  ).join('');
}

function initScroller(id, defaultVal) {
  const scroller = document.getElementById(id);
  if (!scroller) return;
  const itemH = 60;
  const pad = () => { const d = document.createElement('div'); d.style.height = itemH+'px'; d.style.flexShrink='0'; return d; };
  scroller.prepend(pad()); scroller.append(pad());

  let target = null;
  scroller.querySelectorAll('.picker-item').forEach(it => {
    if (parseInt(it.dataset.val) === defaultVal) target = it;
  });
  requestAnimationFrame(() => {
    if (target) scroller.scrollTop = target.offsetTop - scroller.offsetHeight/2 + itemH/2;
    updateHL(scroller);
  });
  let t = null;
  scroller.addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => snapTo(scroller), 80);
    updateHL(scroller);
  }, { passive: true });
}

function snapTo(scroller) {
  const itemH = 60, centerY = scroller.scrollTop + scroller.offsetHeight/2;
  let closest = null, dist = Infinity;
  scroller.querySelectorAll('.picker-item').forEach(item => {
    const d = Math.abs(centerY - (item.offsetTop + itemH/2));
    if (d < dist) { dist = d; closest = item; }
  });
  if (closest) scroller.scrollTo({ top: closest.offsetTop - scroller.offsetHeight/2 + itemH/2, behavior: 'smooth' });
  updateHL(scroller);
}

function updateHL(scroller) {
  const itemH = 60, centerY = scroller.scrollTop + scroller.offsetHeight/2;
  let closest = null, dist = Infinity;
  scroller.querySelectorAll('.picker-item').forEach(item => {
    item.classList.remove('selected');
    const d = Math.abs(centerY - (item.offsetTop + itemH/2));
    if (d < dist) { dist = d; closest = item; }
  });
  if (closest) closest.classList.add('selected');
}

function pickerVal(id) {
  const el = document.getElementById(id);
  if (!el) return 0;
  const sel = el.querySelector('.picker-item.selected');
  return sel ? parseInt(sel.dataset.val) : 0;
}

// ──────────────────── COLLECT CONFIG ─────────────────────────────
function collectConfig() {
  const c = {};
  if (mode === 'interval') {
    c.work = pickerVal('ps-work-min') * 60 + pickerVal('ps-work-sec');
    c.rest = pickerVal('ps-rest-min') * 60 + pickerVal('ps-rest-sec');
    c.rounds = pickerVal('ps-rounds');
  } else if (mode === 'countdown') {
    c.duration = pickerVal('ps-dur-min') * 60 + pickerVal('ps-dur-sec');
  } else if (mode === 'stopwatch') {
    if (submode === 'fortime') {
      c.cap = pickerVal('ps-cap-min') * 60 + pickerVal('ps-cap-sec');
    }
  }
  return c;
}

// ──────────────────────────── PHASES ─────────────────────────────
function buildPhases(c) {
  if (mode === 'interval') {
    const p = [];
    for (let i = 1; i <= c.rounds; i++) {
      p.push({ name:'WORK', dur: c.work*1000, type:'go', round:i });
      if (c.rest > 0) p.push({ name:'REST', dur: c.rest*1000, type:'rest', round:i });
    }
    return p;
  } else if (mode === 'countdown') {
    return [{ name: submode === 'amrap' ? 'AMRAP' : 'GO', dur: c.duration*1000, type:'go', round:1 }];
  } else { // stopwatch
    const cap = (c.cap && c.cap > 0) ? c.cap * 1000 : 359999000; // ~100 hrs
    return [{ name: submode === 'fortime' ? 'FOR TIME' : 'GO', dur: cap, type:'go', round:1 }];
  }
}

// ─────────────────── PRE-START COUNTDOWN ─────────────────────────
function beginCountdown() {
  cfg = collectConfig();
  if (mode === 'interval' && cfg.work < 1) return;
  if (mode === 'countdown' && cfg.duration < 1) return;

  initAudio();
  showScreen('countdown');

  const cdEl = document.getElementById('cd-number');
  let count = 10;

  function showCount() {
    cdEl.textContent = count;
    cdEl.classList.remove('pop'); void cdEl.offsetWidth; cdEl.classList.add('pop');
    beep(440 + (10 - count) * 40, 0.15);
    if (count > 1) { count--; countdownTimeout = setTimeout(showCount, 900); }
    else {
      countdownTimeout = setTimeout(() => {
        cdEl.textContent = 'GO';
        cdEl.classList.remove('pop'); void cdEl.offsetWidth; cdEl.classList.add('pop');
        multiBeep(1047, 2, 100);
        doFlash(getComputedStyle(document.documentElement).getPropertyValue('--go').trim());
        countdownTimeout = setTimeout(startTimer, 600);
      }, 900);
    }
  }
  showCount();
}

// ──────────────────────────── START ──────────────────────────────
function startTimer() {
  const phases = buildPhases(cfg);
  Object.assign(ts, {
    status:'running', phaseIdx:0, phases, round:1,
    intervalId:null, lastRemSec:-1,
    phaseWallStart: Date.now(), pausedElapsed:0,
  });
  acquireWakeLock();
  showScreen('timer'); renderTimer(); tick();
}

// ──────────────────────────── TICK ───────────────────────────────
function tick() {
  if (ts.intervalId) return;
  ts.intervalId = setInterval(() => {
    if (ts.status !== 'running') return;
    const elapsed = getPhaseElapsed();
    const phase = ts.phases[ts.phaseIdx];
    const isCountUp = (submode === 'amrap' || mode === 'stopwatch');

    if (isCountUp && mode !== 'stopwatch') {
      if (elapsed >= phase.dur) { ts.pausedElapsed = phase.dur; finish(); return; }
    } else if (mode === 'stopwatch') {
      if (elapsed >= phase.dur) { ts.pausedElapsed = phase.dur; finish(); return; }
    } else {
      const remMs = phase.dur - elapsed;
      const remSec = Math.ceil(remMs / 1000);
      if (remSec !== ts.lastRemSec) {
        ts.lastRemSec = remSec;
        if (remSec >= 1 && remSec <= 3) beep(880, 0.15);
      }
      if (elapsed >= phase.dur) {
        const overshoot = elapsed - phase.dur;
        const nextIdx = ts.phaseIdx + 1;
        if (nextIdx >= ts.phases.length) { finish(); return; }
        ts.phaseIdx = nextIdx; ts.pausedElapsed = 0;
        ts.phaseWallStart = Date.now() - overshoot; ts.lastRemSec = -1;
        const next = ts.phases[ts.phaseIdx];
        ts.round = next.round;
        if (next.type === 'go') {
          doFlash(getComputedStyle(document.documentElement).getPropertyValue('--go').trim());
          multiBeep(1047, 2, 130);
        } else { doFlash('#FF3535'); multiBeep(330, 3, 110); }
      }
    }
    renderTimer();
  }, 50);
}

function finish() {
  ts.status = 'done'; clearInterval(ts.intervalId); ts.intervalId = null;
  releaseWakeLock();
  renderTimer(); doFlash('#C8FF00'); alarmBeep();
}

// ──────────────────────────── RENDER ─────────────────────────────
function renderTimer() {
  const phase = ts.phases[ts.phaseIdx];
  const done = ts.status === 'done';
  const paused = ts.status === 'paused';
  const elapsed = getPhaseElapsed();
  const isCountUp = (submode === 'amrap' || mode === 'stopwatch');

  const badge = document.getElementById('phase-badge');
  badge.textContent = done ? 'DONE' : phase.name;
  badge.className = 'phase-badge' + (done ? ' done' : phase.type === 'rest' ? ' rest' : '');

  let displayMs = isCountUp ? elapsed : Math.max(0, phase.dur - elapsed);
  const totalSec = isCountUp ? Math.floor(displayMs/1000) : Math.ceil(displayMs/1000);
  const mins = Math.floor(totalSec / 60);
  const secs = totalSec % 60;

  const bigTime = document.getElementById('big-time');
  bigTime.textContent = String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
  bigTime.className = 'big-time' + (done ? ' done' : phase.type === 'rest' ? ' rest' : ' go');

  const pct = Math.min(100, (elapsed / phase.dur) * 100);
  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.className = 'progress-fill' + (phase.type === 'rest' ? ' rest' : '');

  const roundEl = document.getElementById('round-display');
  roundEl.innerHTML = (mode === 'interval')
    ? `Round<strong>${phase.round} / ${cfg.rounds}</strong>` : '';

  const nextEl = document.getElementById('next-up');
  const nextIdx = ts.phaseIdx + 1;
  if (done) { nextEl.className = 'next-up done-msg'; nextEl.textContent = 'Great work! 💪'; }
  else if (nextIdx < ts.phases.length) {
    const next = ts.phases[nextIdx];
    nextEl.className = 'next-up';
    nextEl.innerHTML = `Next: <span>${next.name} — ${Math.round(next.dur/1000)}s</span>`;
  } else if (!isCountUp) { nextEl.className = 'next-up'; nextEl.innerHTML = `<span>Last phase!</span>`; }
  else { nextEl.textContent = ''; }

  const btn = document.getElementById('play-pause-btn');
  if (done) { btn.textContent = 'DONE'; btn.className = 'ctrl-btn primary done-state'; }
  else if (paused) { btn.textContent = 'RESUME'; btn.className = 'ctrl-btn primary paused'; }
  else { btn.textContent = 'PAUSE'; btn.className = 'ctrl-btn primary'; }
}

// ──────────────────────── CONTROLS ───────────────────────────────
function togglePlayPause() {
  if (ts.status === 'done') return;
  if (ts.status === 'running') {
    ts.pausedElapsed = getPhaseElapsed(); ts.status = 'paused';
    clearInterval(ts.intervalId); ts.intervalId = null;
  } else if (ts.status === 'paused') {
    ts.status = 'running'; ts.phaseWallStart = Date.now();
    tick(); acquireWakeLock();
  }
  renderTimer();
}

function resetTimer() {
  clearInterval(ts.intervalId); ts.intervalId = null;
  ts.status = 'idle'; clearTimeout(countdownTimeout);
  releaseWakeLock(); showScreen('mode');
}

// ──────────────────────────── AUDIO ──────────────────────────────
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq = 880, dur = 0.1) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  try {
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = (i*2)/256-1; curve[i] = Math.max(-0.6, Math.min(0.6, x*3)); }
    const shaper = audioCtx.createWaveShaper(); shaper.curve = curve; shaper.oversample = '4x';
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value=-6; comp.knee.value=0; comp.ratio.value=20; comp.attack.value=0.001; comp.release.value=0.1;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    gain.connect(shaper); shaper.connect(comp); comp.connect(audioCtx.destination);
    const allNodes = [gain, shaper, comp];
    const oscs = [freq, freq*1.005, freq*0.995].map(f => {
      const osc = audioCtx.createOscillator(); osc.connect(gain);
      osc.frequency.value=f; osc.type='square';
      osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime+dur); return osc;
    });
    const saw = audioCtx.createOscillator();
    const sawGain = audioCtx.createGain();
    sawGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    sawGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    saw.connect(sawGain); sawGain.connect(comp);
    saw.frequency.setValueAtTime(freq, audioCtx.currentTime);
    saw.frequency.linearRampToValueAtTime(freq*1.08, audioCtx.currentTime+dur);
    saw.type='sawtooth'; saw.start(audioCtx.currentTime); saw.stop(audioCtx.currentTime+dur);
    allNodes.push(sawGain);
    saw.onended = () => {
      oscs.forEach(o => { try{o.disconnect();}catch(e){} });
      try{saw.disconnect();}catch(e){}
      allNodes.forEach(n => { try{n.disconnect();}catch(e){} });
    };
  } catch(e) {}
}

function multiBeep(freq, count, gapMs) {
  for (let i = 0; i < count; i++) setTimeout(() => beep(freq, 0.12), i * gapMs);
}
function alarmBeep() {
  for (let i = 0; i < 3; i++) setTimeout(() => beep(600 + i*300, 0.3), i * 320);
}

// ─────────────────────────── FLASH ───────────────────────────────
function doFlash(color) {
  const el = document.getElementById('flash');
  el.style.background = color;
  el.classList.remove('flash-in'); void el.offsetWidth;
  el.classList.add('flash-in');
}

// ──────────────────────── WAKE LOCK ──────────────────────────────
async function acquireWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch(e) {} wakeLock = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && ts.status === 'running') {
    acquireWakeLock();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    const prevPhaseIdx = ts.phaseIdx;
    let elapsed = getPhaseElapsed();
    let phase = ts.phases[ts.phaseIdx];
    while (elapsed >= phase.dur && ts.phaseIdx < ts.phases.length - 1) {
      const overshoot = elapsed - phase.dur;
      ts.phaseIdx++; const next = ts.phases[ts.phaseIdx];
      ts.round = next.round; ts.pausedElapsed = 0;
      ts.phaseWallStart = Date.now() - overshoot;
      phase = next; elapsed = overshoot;
    }
    if (elapsed >= phase.dur && ts.phaseIdx >= ts.phases.length - 1) { finish(); }
    else {
      if (ts.phaseIdx !== prevPhaseIdx) {
        doFlash(phase.type === 'rest' ? '#FF3535' : '#C8FF00');
        alarmBeep();
      }
      renderTimer();
    }
  }
});

// ═══════════════════════ WEEKLY SESSIONS ═══════════════════════
// Sessions come from ./sessions.json (written at the weekly review), exercises from
// ./exercises.json. The runner below reuses the free timer's audio, flash, wake lock
// and screen helpers but keeps its own state so the free timer is untouched.
const LS = { log: 'gt_log_v1', done: 'gt_done_v1', data: 'gt_data_v1' };
const S = {
  plan: null, exMap: {}, session: null, record: null,
  phases: [], results: [], idx: 0, status: 'idle',
  wallStart: 0, pausedElapsed: 0, intervalId: null, lastRemSec: -1,
  startedAt: 0, repsVal: 0, sessionIdx: -1,
};

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtMMSS(sec) { sec = Math.max(0, sec|0); return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function fmtDate(iso) { const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const p = String(iso).split('-'); return p.length === 3 ? m[+p[1]-1] + ' ' + (+p[2]) : iso; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1400); }

// ── plan loading ──
async function loadPlan() {
  let plan = null, exs = null;
  try {
    const [p, e] = await Promise.all([
      fetch('./sessions.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('./exercises.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    plan = p; exs = e;
  } catch(e) {}
  const cached = lsGet(LS.data, null);
  if (plan && exs) lsSet(LS.data, { plan, exs });
  else if (cached) { plan = plan || cached.plan; exs = exs || cached.exs; }
  S.plan = plan; S.exMap = {};
  ((exs && exs.exercises) || []).forEach(x => { S.exMap[x.id] = x; });
  renderHome();
}

function exName(id) { const x = S.exMap[id]; return x ? x.name : String(id).replace(/_/g, ' '); }
function isSided(it) { const x = S.exMap[it.exercise]; return !!(it.side || (x && /_side$/.test(x.type || ''))); }
function isTimed(it) { return it.seconds != null; }
function blockRest(b) { return b.rest != null ? b.rest : 60; }
function itemRx(it) { return (isTimed(it) ? it.seconds + ' s' : String(it.reps)) + (isSided(it) ? '/side' : ''); }
function rxText(b) { return `${b.sets} × ${itemRx(b)}`; }
function itemWorkSec(it) { return (isTimed(it) ? it.seconds : (it.reps || 0) * 4 + 10) * (isSided(it) ? 2 : 1); }
function isDone(s) { return !!(s.done || lsGet(LS.done, {})[s.id]); }

function estimateMin(s) {
  let sec = 0;
  (s.blocks || []).forEach(b => {
    if (b.type === 'amrap') { sec += b.seconds || 0; return; }
    if (b.type === 'circuit') {
      for (let r = 0; r < b.rounds; r++) {
        (b.items || []).forEach(it => { sec += itemWorkSec(it); });
        if (r < b.rounds - 1) sec += blockRest(b);
      }
      return;
    }
    sec += (b.sets || 1) * (itemWorkSec(b) + blockRest(b));
  });
  return Math.max(1, Math.round(sec / 60));
}

// ── home ──
function renderHome() {
  const list = document.getElementById('sess-list');
  const sub = document.getElementById('home-sub');
  const wk = document.getElementById('week-label');
  const copyBtn = document.getElementById('copy-week-btn');
  if (!S.plan || !Array.isArray(S.plan.sessions) || !S.plan.sessions.length) {
    sub.textContent = 'No plan loaded';
    wk.textContent = '';
    list.innerHTML = `<div class="sess-empty">No plan on this phone yet.<br>Open once with a connection to download this week.</div>`;
    copyBtn.hidden = true;
    return;
  }
  const today = todayISO();
  const ss = S.plan.sessions;
  const doneN = ss.filter(isDone).length;
  sub.textContent = `${doneN} of ${ss.length} done`;
  wk.textContent = [S.plan.week, S.plan.updated ? 'updated ' + fmtDate(S.plan.updated) : ''].filter(Boolean).join(' · ');
  list.innerHTML = ss.map((s, i) => {
    const done = isDone(s), isToday = s.date === today;
    const meta = [ s.date ? fmtDate(s.date) : '', `~${estimateMin(s)} min`, s.location, s.when ].filter(Boolean).join(' · ');
    const icon = done ? '✓' : isToday ? '▶' : '›';
    return `<div class="sess-card${done ? ' done' : ''}${isToday && !done ? ' today' : ''}" onclick="openSession(${i})">
      <div class="sess-main">
        <div class="sess-title"><em>${esc(s.day || '')}</em> ${esc(s.name)}</div>
        <div class="sess-meta">${esc(meta)}</div>
      </div>
      <div class="sess-icon">${icon}</div>
    </div>`;
  }).join('');
  const ids = new Set(ss.map(s => s.id));
  copyBtn.hidden = !lsGet(LS.log, []).some(r => ids.has(r.sessionId));
}

// ── session detail ──
function openSession(i) {
  const s = S.plan.sessions[i]; if (!s) return;
  S.session = s; S.sessionIdx = i;
  document.getElementById('sess-title').textContent = `${s.day ? s.day + ' · ' : ''}${s.name}`.toUpperCase();
  const parts = [];
  if (isDone(s)) parts.push(`<div class="sess-note muted">Done ✓ — start again to repeat it, or go back.</div>`);
  if (s.note) parts.push(`<div class="sess-note">${esc(s.note)}</div>`);
  parts.push(`<div class="block-list">${(s.blocks || []).map(blockRowHTML).join('')}</div>`);
  parts.push(`<div class="sess-est">~${estimateMin(s)} min with rest</div>`);
  document.getElementById('sess-detail').innerHTML = parts.join('');
  document.getElementById('clear-log-btn').hidden = !hasLocalLog(s);
  showScreen('session');
}

function blockRowHTML(b) {
  if (b.type === 'circuit') {
    const items = (b.items || []).map(it => `${exName(it.exercise)} ${itemRx(it)}${it.load ? ' @ ' + it.load : ''}`).join(' · ');
    return `<div class="block-row"><div class="block-name">Circuit <small>${b.rounds} rounds</small></div><div class="block-rx">${esc(items)}<small>rest ${blockRest(b)} s between rounds</small></div></div>`;
  }
  if (b.type === 'amrap') {
    return `<div class="block-row"><div class="block-name">${esc(exName(b.exercise))} <small>AMRAP</small></div><div class="block-rx">${Math.round((b.seconds || 0) / 60)} min<small>max reps · count them</small></div></div>`;
  }
  const sub = [`rest ${blockRest(b)} s`, b.load, b.note].filter(Boolean).join(' · ');
  return `<div class="block-row${b.optional ? ' optional' : ''}"><div class="block-name">${esc(exName(b.exercise))}${b.optional ? ' <small>optional</small>' : ''}</div><div class="block-rx">${esc(rxText(b))}<small>${esc(sub)}</small></div></div>`;
}

// ── phase expansion ──
function buildSessionPhases(s) {
  const P = [];
  const work = (it, blockIdx, itemIdx, setIdx, setsTotal, roundLabel, extra) => {
    const sided = isSided(it), timed = isTimed(it);
    (sided ? ['LEFT', 'RIGHT'] : [null]).forEach(side => P.push(Object.assign({
      kind: 'work', timed, dur: timed ? it.seconds * 1000 : null,
      ex: exName(it.exercise), side, target: timed ? it.seconds : (it.reps || 0),
      load: it.load || '', note: it.note || '',
      blockIdx, itemIdx, setIdx, setsTotal, roundLabel: roundLabel || '',
    }, extra || {})));
  };
  (s.blocks || []).forEach((b, bi) => {
    if (b.type === 'amrap') {
      P.push({ kind: 'work', timed: true, dur: (b.seconds || 0) * 1000, ex: exName(b.exercise), side: null,
        target: b.seconds || 0, load: b.load || '', note: 'max reps · count them',
        blockIdx: bi, itemIdx: 0, setIdx: 0, setsTotal: 1, roundLabel: '', amrap: true });
      return;
    }
    if (b.type === 'circuit') {
      for (let r = 0; r < b.rounds; r++) {
        (b.items || []).forEach((it, ii) => work(it, bi, ii, r, b.rounds, `Round ${r + 1} of ${b.rounds}`));
        if (blockRest(b) > 0 && r < b.rounds - 1) P.push({ kind: 'rest', timed: true, dur: blockRest(b) * 1000, blockIdx: bi });
      }
      return;
    }
    for (let k = 0; k < (b.sets || 1); k++) {
      work(b, bi, 0, k, b.sets || 1, '');
      if (blockRest(b) > 0) P.push({ kind: 'rest', timed: true, dur: blockRest(b) * 1000, blockIdx: bi });
    }
  });
  while (P.length && P[P.length - 1].kind === 'rest') P.pop();
  if (P.length && P[0].timed) P.unshift({ kind: 'rest', ready: true, timed: true, dur: 5000, blockIdx: -1 });
  return P;
}

// ── runner ──
function sElapsed() { return S.status === 'running' ? S.pausedElapsed + (Date.now() - S.wallStart) : S.pausedElapsed; }

function startSession() {
  const s = S.session; if (!s) return;
  S.phases = buildSessionPhases(s);
  if (!S.phases.length) return;
  S.results = S.phases.map(() => ({}));
  S.status = 'running'; S.startedAt = Date.now();
  initAudio(); acquireWakeLock();
  enterPhase(0, 0, false);
  showScreen('run'); renderRunStatic(); runTick();
}

function enterPhase(i, overshoot, cue) {
  S.idx = i; S.pausedElapsed = 0; S.wallStart = Date.now() - (overshoot || 0); S.lastRemSec = -1;
  const p = S.phases[i];
  S.repsVal = (p.kind === 'work' && !p.timed) ? p.target : 0;
  if (cue) {
    if (p.kind === 'rest') { doFlash('#FF3535'); multiBeep(330, 3, 110); }
    else { doFlash('#C8FF00'); multiBeep(1047, 2, 130); }
  }
}

function runTick() {
  if (S.intervalId) return;
  S.intervalId = setInterval(() => {
    if (S.status !== 'running') return;
    const p = S.phases[S.idx]; if (!p) return;
    const el = sElapsed();
    if (p.timed) {
      const remSec = Math.ceil((p.dur - el) / 1000);
      if (remSec !== S.lastRemSec) { S.lastRemSec = remSec; if (remSec >= 1 && remSec <= 3) beep(880, 0.15); }
      if (el >= p.dur) { completePhase(el - p.dur, true); return; }
    }
    renderRunDynamic();
  }, 50);
}

// Records the current phase's result and moves on. Returns false when the session ended.
function completePhase(overshoot, cue) {
  const p = S.phases[S.idx]; const el = sElapsed(); const r = S.results[S.idx];
  if (p.kind === 'work') {
    if (p.timed) r.actual = Math.min(p.target, Math.round(el / 1000));
    else { r.actual = S.repsVal; r.sec = Math.round(el / 1000); }
  } else { r.skipped = el < p.dur - 500; r.dur = Math.round(el / 1000); }
  const next = S.idx + 1;
  if (next >= S.phases.length) { finishSession(false); return false; }
  enterPhase(next, overshoot || 0, cue);
  renderRunStatic();
  return true;
}

function doneSet()   { if (S.status === 'running') completePhase(0, true); }
function skipRest()  { if (S.status === 'running') completePhase(0, true); }
function skipHold()  { if (S.status === 'running' || S.status === 'paused') { if (S.status === 'paused') { S.status = 'running'; S.wallStart = Date.now(); runTick(); } completePhase(0, true); } }
function extendRest(sec) { const p = S.phases[S.idx]; if (p && p.kind === 'rest') { p.dur += sec * 1000; renderRunDynamic(); } }
function stepReps(d) { S.repsVal = Math.max(0, S.repsVal + d); renderRunDynamic(); }

function toggleRunPause() {
  if (S.status === 'running') { S.pausedElapsed = sElapsed(); S.status = 'paused'; clearInterval(S.intervalId); S.intervalId = null; }
  else if (S.status === 'paused') { S.status = 'running'; S.wallStart = Date.now(); runTick(); acquireWakeLock(); }
  renderRunStatic();
}

function endSessionEarly() {
  if (S.status === 'done') return;
  if (!confirm('End the session now? What you did so far gets logged.')) return;
  finishSession(true);
}

function renderRunStatic() {
  const p = S.phases[S.idx]; if (!p) return;
  const isRest = p.kind === 'rest', isReady = !!p.ready, paused = S.status === 'paused';
  const badge = document.getElementById('run-badge');
  badge.textContent = isReady ? 'READY' : isRest ? 'REST' : p.timed ? (p.amrap ? 'AMRAP' : 'HOLD') : 'SET';
  badge.className = 'phase-badge' + (isRest && !isReady ? ' rest' : '');
  const setLabel = isRest ? '' : (p.roundLabel || `Set ${p.setIdx + 1} of ${p.setsTotal}`);
  document.getElementById('run-progress').innerHTML = `${S.idx + 1} / ${S.phases.length}<strong>${esc(setLabel) || '&nbsp;'}</strong>`;

  const nameEl = document.getElementById('run-ex-name');
  const sideEl = document.getElementById('run-ex-side');
  const subEl  = document.getElementById('run-ex-sub');
  if (isRest) { nameEl.textContent = isReady ? 'GET READY' : 'REST'; nameEl.classList.toggle('rest', !isReady); sideEl.textContent = ''; subEl.textContent = ''; }
  else {
    nameEl.textContent = p.ex; nameEl.classList.remove('rest');
    sideEl.textContent = p.side || '';
    subEl.textContent = [p.load, p.note].filter(Boolean).join(' · ');
  }

  const disp = document.getElementById('run-display');
  if (p.timed) disp.innerHTML = `<div class="big-time${isRest && !isReady ? ' rest' : ' go'}" id="run-time">00:00</div>`;
  else disp.innerHTML = `<div class="stepper"><button class="num-btn" onclick="stepReps(-1)" aria-label="minus one rep">−</button><div class="stepper-val" id="run-reps">${S.repsVal}</div><button class="num-btn" onclick="stepReps(1)" aria-label="plus one rep">+</button></div><div class="stepper-label">reps · target ${p.target}${p.side ? ' per side' : ''}</div><div class="run-elapsed" id="run-elapsed">00:00</div>`;

  const n = S.phases[S.idx + 1];
  const nextTxt = !n ? 'Last one'
    : n.kind === 'rest' ? `Rest ${Math.round(n.dur / 1000)} s`
    : `${n.ex}${n.side ? ' ' + n.side.toLowerCase() : ''} · ${n.timed ? n.target + ' s' : n.target + ' reps'}${n.load ? ' @ ' + n.load : ''}`;
  document.getElementById('run-next').innerHTML = `Next: <span>${esc(nextTxt)}</span>`;

  const ctr = document.getElementById('run-controls');
  if (isReady) ctr.innerHTML = `<button class="ctrl-btn primary" onclick="skipRest()">START NOW</button>`;
  else if (isRest) ctr.innerHTML = `<button class="ctrl-btn" onclick="extendRest(30)">+30 S</button><button class="ctrl-btn primary" onclick="skipRest()">SKIP REST</button>`;
  else if (p.timed) ctr.innerHTML = `<button class="ctrl-btn" onclick="skipHold()">${p.amrap ? 'FINISH' : 'SKIP'}</button><button class="ctrl-btn primary${paused ? ' paused' : ''}" onclick="toggleRunPause()">${paused ? 'RESUME' : 'PAUSE'}</button>`;
  else ctr.innerHTML = `<button class="ctrl-btn primary" onclick="doneSet()">DONE</button>`;

  document.getElementById('run-fill').className = 'progress-fill' + (isRest && !isReady ? ' rest' : '');
  renderRunDynamic();
}

function renderRunDynamic() {
  const p = S.phases[S.idx]; if (!p) return;
  const el = sElapsed();
  if (p.timed) { const t = document.getElementById('run-time'); if (t) t.textContent = fmtMMSS(Math.ceil(Math.max(0, p.dur - el) / 1000)); }
  else {
    const r = document.getElementById('run-reps'); if (r) r.textContent = S.repsVal;
    const e = document.getElementById('run-elapsed'); if (e) e.textContent = fmtMMSS(Math.floor(el / 1000));
  }
  const frac = (S.idx + (p.timed ? Math.min(1, el / p.dur) : 0)) / S.phases.length;
  document.getElementById('run-fill').style.width = (frac * 100).toFixed(1) + '%';
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || S.status !== 'running') return;
  acquireWakeLock();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  let moved = false;
  while (S.status === 'running') {
    const p = S.phases[S.idx];
    if (!p || !p.timed || sElapsed() < p.dur) break;
    if (!completePhase(sElapsed() - p.dur, false)) return;
    moved = true;
  }
  if (moved) { const p = S.phases[S.idx]; doFlash(p.kind === 'rest' ? '#FF3535' : '#C8FF00'); alarmBeep(); }
  renderRunStatic();
});

// ── finishing + log ──
function summarizeBlocks(s) {
  return (s.blocks || []).map((b, bi) => {
    const isCircuit = b.type === 'circuit', isAmrap = b.type === 'amrap';
    const items = isCircuit ? (b.items || []) : [b];
    const entries = items.map((it, ii) => {
      const idxs = S.phases.map((p, i) => (p.kind === 'work' && p.blockIdx === bi && p.itemIdx === ii) ? i : -1).filter(i => i >= 0);
      const sided = isSided(it), step = sided ? 2 : 1;
      const acts = [];
      for (let k = 0; k + step - 1 < idxs.length; k += step) {
        const a = S.results[idxs[k]]; if (a.actual == null) break;
        if (sided) { const r2 = S.results[idxs[k + 1]]; acts.push(`L${a.actual} R${r2.actual != null ? r2.actual : '-'}`); }
        else acts.push(String(a.actual));
      }
      const rx = isAmrap ? `${Math.round((b.seconds || 0) / 60)} min AMRAP`
        : isCircuit ? `${b.rounds} × ${itemRx(it)}`
        : `${rxText(b)}, rest ${blockRest(b)} s`;
      return { exercise: exName(it.exercise), rx, load: it.load || '', sided, actual: acts, of: idxs.length / step };
    });
    const restIdxs = S.phases.map((p, i) => (p.kind === 'rest' && p.blockIdx === bi) ? i : -1).filter(i => i >= 0);
    return { amrap: isAmrap, amrapReps: null, restSkipped: restIdxs.filter(i => S.results[i].skipped).length, entries };
  });
}

function makeRecord(s, aborted, manual) {
  const durationSec = manual ? 0 : Math.round((Date.now() - S.startedAt) / 1000);
  const blocks = manual
    ? (s.blocks || []).map(b => ({ amrap: b.type === 'amrap', amrapReps: null, restSkipped: 0,
        entries: (b.type === 'circuit' ? (b.items || []) : [b]).map(it => ({ exercise: exName(it.exercise),
          rx: b.type === 'amrap' ? `${Math.round((b.seconds || 0) / 60)} min AMRAP` : b.type === 'circuit' ? `${b.rounds} × ${itemRx(it)}` : `${rxText(b)}, rest ${blockRest(b)} s`,
          load: it.load || '', sided: isSided(it), actual: [], of: 0 })) }))
    : summarizeBlocks(s);
  return { sessionId: s.id, name: s.name, day: s.day || '', date: s.date || todayISO(), completedAt: new Date().toISOString(),
    durationSec, aborted: !!aborted, manual: !!manual, blocks, notes: '' };
}

function saveRecord(rec) {
  const log = lsGet(LS.log, []);
  const i = log.findIndex(r => r.completedAt === rec.completedAt && r.sessionId === rec.sessionId);
  if (i >= 0) log[i] = rec; else log.push(rec);
  while (log.length > 200) log.shift();
  lsSet(LS.log, log);
  if (!rec.aborted) { const d = lsGet(LS.done, {}); d[rec.sessionId] = rec.completedAt; lsSet(LS.done, d); }
}

function finishSession(aborted) {
  clearInterval(S.intervalId); S.intervalId = null;
  S.status = 'done'; releaseWakeLock();
  const rec = makeRecord(S.session, aborted, false);
  if (aborted && !recordHasWork(rec)) { toast('NOTHING LOGGED'); showScreen('mode'); renderHome(); return; }
  saveRecord(rec); S.record = rec;
  if (!aborted) { doFlash('#C8FF00'); alarmBeep(); }
  renderSummary(rec); showScreen('summary');
}

function recordHasWork(rec) {
  return rec.manual || rec.blocks.some(b => b.amrapReps != null || b.entries.some(e => e.actual.length > 0));
}
function hasLocalLog(s) {
  return lsGet(LS.log, []).some(r => r.sessionId === s.id) || !!lsGet(LS.done, {})[s.id];
}

// Drop the record currently shown on the summary (and its done mark, if it set one).
function discardRecord() {
  const rec = S.record; if (!rec) return;
  if (!confirm('Discard this log?')) return;
  lsSet(LS.log, lsGet(LS.log, []).filter(r => !(r.sessionId === rec.sessionId && r.completedAt === rec.completedAt)));
  const d = lsGet(LS.done, {});
  if (d[rec.sessionId] === rec.completedAt) { delete d[rec.sessionId]; lsSet(LS.done, d); }
  S.record = null; toast('DISCARDED');
  showScreen('mode'); renderHome();
}

// Wipe everything this phone has logged for the open session.
function clearSessionLog() {
  const s = S.session; if (!s) return;
  if (!confirm('Clear everything logged for this session on this phone?')) return;
  lsSet(LS.log, lsGet(LS.log, []).filter(r => r.sessionId !== s.id));
  const d = lsGet(LS.done, {}); delete d[s.id]; lsSet(LS.done, d);
  toast('CLEARED'); openSession(S.sessionIdx);
}

function markDoneManual() {
  if (!S.session) return;
  const rec = makeRecord(S.session, false, true);
  saveRecord(rec); S.record = rec;
  renderSummary(rec); showScreen('summary');
}

function actualText(rec, b, e) {
  if (b.amrap) return b.amrapReps != null ? `${b.amrapReps} reps` : '? reps';
  if (rec.manual) return 'as prescribed';
  return e.actual.length ? e.actual.join(e.sided ? ' · ' : '/') : 'not done';
}

function renderSummary(rec) {
  document.getElementById('sum-title').textContent = rec.aborted ? 'ENDED' : rec.manual ? 'LOGGED' : 'DONE';
  document.getElementById('sum-meta').textContent = `${rec.day ? rec.day + ' · ' : ''}${rec.name}${rec.manual ? '' : ' · ' + fmtMMSS(rec.durationSec)}`;
  const lines = [];
  rec.blocks.forEach((b, bi) => b.entries.forEach(e => {
    const act = b.amrap
      ? `<input type="number" inputmode="numeric" placeholder="reps" value="${b.amrapReps != null ? b.amrapReps : ''}" onchange="setAmrapReps(${bi}, this.value)">`
      : esc(actualText(rec, b, e));
    const small = [e.rx, e.load, b.restSkipped ? `${b.restSkipped} rest skipped` : ''].filter(Boolean).join(' · ');
    lines.push(`<div class="sum-line"><div class="sum-ex">${esc(e.exercise)}</div><div class="sum-act">${act}<small>${esc(small)}</small></div></div>`);
  }));
  document.getElementById('sum-lines').innerHTML = lines.join('');
  const ta = document.getElementById('sum-notes');
  ta.value = rec.notes || '';
  ta.oninput = () => { rec.notes = ta.value; saveRecord(rec); };
}

function setAmrapReps(bi, v) { if (!S.record) return; const n = parseInt(v, 10); S.record.blocks[bi].amrapReps = isNaN(n) ? null : n; saveRecord(S.record); }

function recordText(rec) {
  const L = [`${rec.date}${rec.day ? ' ' + rec.day : ''} · ${rec.name} · ${rec.manual ? 'no timer' : fmtMMSS(rec.durationSec)}${rec.aborted ? ' · ended early' : ''}`];
  rec.blocks.forEach(b => b.entries.forEach(e => {
    const extras = [e.load, b.restSkipped ? `${b.restSkipped} rest skipped` : ''].filter(Boolean);
    L.push(`- ${e.exercise}: ${e.rx}${extras.length ? ' (' + extras.join(', ') + ')' : ''} → ${actualText(rec, b, e)}`);
  }));
  if (rec.notes) L.push(`Notes: ${rec.notes}`);
  return L.join('\n');
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('COPIED'); return; } catch(e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = t;
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('COPIED');
  } catch(e) { toast('COPY FAILED'); }
}
function copySessionLog() { if (S.record) copyText(recordText(S.record)); }
function copyWeekLog() {
  if (!S.plan) return;
  const ids = new Set((S.plan.sessions || []).map(s => s.id));
  const recs = lsGet(LS.log, []).filter(r => ids.has(r.sessionId)).sort((a, b) => a.completedAt < b.completedAt ? -1 : 1);
  if (!recs.length) { toast('NOTHING LOGGED'); return; }
  copyText(`Strength log · ${S.plan.week || ''}\n\n` + recs.map(recordText).join('\n\n'));
}

document.addEventListener('DOMContentLoaded', loadPlan);

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
